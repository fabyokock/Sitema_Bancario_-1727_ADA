<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sistema Bancário</title>

    <!--
      A ordem dos scripts é importante.

      api.js:
      disponibiliza as funções de comunicação com a API.

      validacao.js:
      disponibiliza a função validarCliente.

      ui.js:
      disponibiliza a renderização da tabela.

      main.js:
      utiliza as funções dos três arquivos anteriores.
    -->
    <script src="js/api.js" defer></script>
    <script src="js/validacao.js" defer></script>
    <script src="js/ui.js" defer></script>
    <script src="js/main.js" defer></script>

    <link rel="stylesheet" href="styles/style.css" />
  </head>

  <body>
    <h1>Sistema Bancário</h1>

    <!--
      Área utilizada para mensagens gerais de sucesso ou erro.

      Exemplos:
      "Cliente criado com sucesso."
      "Não foi possível carregar os clientes."
    -->
    <div id="area-mensagens" role="alert"></div>

    <!-- ========================================= -->
    <!-- CLIENTES                                  -->
    <!-- ========================================= -->

    <section>
      <h2>Clientes</h2>

      <!--
        O mesmo formulário será utilizado para criar
        e editar clientes.

        O controle da edição não será mais feito por
        um input hidden.

        O main.js utilizará a variável clienteEmEdicao.
      -->
      <form id="form-cliente" novalidate>
        <label for="cliente-nome">Nome</label>

        <input type="text" id="cliente-nome" required />

        <label for="cliente-cpf">CPF</label>

        <input type="text" id="cliente-cpf" required />

        <label for="cliente-email">Email</label>

        <input type="email" id="cliente-email" required />

        <!--
          Uma única área exibe todos os erros encontrados
          na validação do formulário de cliente.
        -->
        <div id="erro-cliente" role="alert"></div>

        <button type="submit">Salvar Cliente</button>
      </form>

      <!--
        Campo já preparado para a futura implementação
        do bônus de filtro por nome.
      -->
      <label for="filtro-cliente-nome"> Buscar por nome </label>

      <input type="search" id="filtro-cliente-nome" />

      <table id="tabela-clientes">
        <thead>
          <tr>
            <th>Nome</th>
            <th>CPF</th>
            <th>Email</th>
            <th>Ações</th>
          </tr>
        </thead>

        <tbody id="tabela-clientes-corpo">
          <!--
            As linhas dos clientes serão criadas
            dinamicamente pelo ui.js.
          -->
        </tbody>
      </table>
    </section>

    <!-- ========================================= -->
    <!-- CONTAS                                    -->
    <!-- ========================================= -->

    <section>
      <h2>Contas</h2>

      <!--
        Estrutura preparada para a próxima fase do projeto.
        A lógica das contas ainda será implementada.
      -->
      <form id="form-conta">
        <label for="conta-cliente">Cliente</label>

        <select id="conta-cliente" required>
          <option value="">Selecione um cliente</option>
        </select>

        <div id="erro-conta" role="alert"></div>

        <label for="conta-tipo">Tipo</label>

        <select id="conta-tipo">
          <option value="Corrente">Corrente</option>

          <option value="Poupança">Poupança</option>
        </select>

        <p>Saldo inicial: R$ 0,00</p>

        <button type="submit">Salvar Conta</button>
      </form>

      <table id="tabela-contas">
        <thead>
          <tr>
            <th>Número</th>
            <th>Cliente</th>
            <th>Tipo</th>
            <th>Saldo</th>
            <th>Status</th>
            <th>Ações</th>
          </tr>
        </thead>

        <tbody id="tabela-contas-corpo">
          <!--
            As linhas das contas serão criadas
            dinamicamente quando o módulo for implementado.
          -->
        </tbody>
      </table>
    </section>

    <!-- ========================================= -->
    <!-- TRANSAÇÕES                                -->
    <!-- ========================================= -->

    <section>
      <h2>Transações</h2>

      <!--
        Estrutura preparada para depósitos e saques.
        A lógica será implementada em uma próxima fase.
      -->
      <form id="form-transacao">
        <label for="transacao-conta">Conta</label>

        <select id="transacao-conta" required>
          <option value="">Selecione uma conta</option>
        </select>

        <label for="transacao-tipo">Tipo</label>

        <select id="transacao-tipo">
          <option value="Depósito">Depósito</option>

          <option value="Saque">Saque</option>
        </select>

        <label for="transacao-valor">Valor</label>

        <input
          type="number"
          id="transacao-valor"
          min="0.01"
          step="0.01"
          required
        />

        <div id="erro-transacao" role="alert"></div>

        <button type="submit">Registrar</button>
      </form>

      <h3>Histórico</h3>

      <table id="tabela-transacoes">
        <thead>
          <tr>
            <th>Data</th>
            <th>Tipo</th>
            <th>Valor</th>
            <th>Saldo Novo</th>
          </tr>
        </thead>

        <tbody id="tabela-transacoes-corpo">
          <!--
            As transações serão criadas dinamicamente
            quando o módulo for implementado.
          -->
        </tbody>
      </table>

      <div id="paginacao-transacoes">
        <button type="button" id="btn-pagina-anterior">Anterior</button>

        <span id="pagina-atual-info"></span>

        <button type="button" id="btn-pagina-proxima">Próxima</button>
      </div>
    </section>
  </body>
</html>
